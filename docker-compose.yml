version: '3.8'

services:
  # -------------------------------------------------------------
  # Redis - Fila de Mensagens BullMQ e Cache
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tiktok-autopilot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - autopilot-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # API Backend (Fastify + BullMQ + FFmpeg + AI Engine)
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tiktok-autopilot-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SUPABASE_URL=${SUPABASE_URL:-http://localhost:54321}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-mock_key}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - autopilot-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------
  # Web Dashboard Frontend (React + TailwindCSS + Nginx)
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: tiktok-autopilot-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - autopilot-net

networks:
  autopilot-net:
    driver: bridge

volumes:
  redis_data:
    driver: local
